name: Build APK Renamer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f APK_Renamer_V0.4_MobileBuild.zip
          mkdir -p "$RUNNER_TEMP/apk-renamer"
          unzip -q APK_Renamer_V0.4_MobileBuild.zip -d "$RUNNER_TEMP/apk-renamer"
          PROJECT="$RUNNER_TEMP/apk-renamer/APK_Renamer_V0.3"
          test -f "$PROJECT/settings.gradle.kts"
          rsync -a --exclude=".github/" "$PROJECT/" "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build Android Apktool runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/anirudhmalik/apktool-android.git "$RUNNER_TEMP/apktool-android"
          cd "$RUNNER_TEMP/apktool-android"
          ./gradlew --no-daemon :brut.apktool:apktool-android:assembleRelease :brut.apktool:apktool-android:collectRuntimeJars
          AAR="$(find brut.apktool/apktool-android/build/outputs/aar -maxdepth 1 -type f -name '*release*.aar' | head -n 1)"
          JAR_DIR="brut.apktool/apktool-android/build/libs-bundle"
          test -n "$AAR"
          test -d "$JAR_DIR"
          mkdir -p "$GITHUB_WORKSPACE/app/libs/apktool/runtime"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/apktool/apktool-android-1.0.0.aar"
          find "$JAR_DIR" -maxdepth 1 -type f -name '*.jar' -exec cp {} "$GITHUB_WORKSPACE/app/libs/apktool/runtime/" \;
          test "$(find "$GITHUB_WORKSPACE/app/libs/apktool/runtime" -name '*.jar' | wc -l)" -gt 0

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Renamer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
