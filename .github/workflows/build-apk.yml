name: Build APK Renamer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f APK_Renamer_V0.4_MobileBuild.zip
          mkdir -p "$RUNNER_TEMP/apk-renamer"
          unzip -q APK_Renamer_V0.4_MobileBuild.zip -d "$RUNNER_TEMP/apk-renamer"
          PROJECT="$RUNNER_TEMP/apk-renamer/APK_Renamer_V0.3"
          test -f "$PROJECT/settings.gradle.kts"
          rsync -a --exclude=".github/" "$PROJECT/" "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build Android Apktool runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/anirudhmalik/apktool-android.git "$RUNNER_TEMP/apktool-android"
          cd "$RUNNER_TEMP/apktool-android"
          ./gradlew --no-daemon :brut.apktool:apktool-android:assembleRelease :brut.apktool:apktool-android:collectRuntimeJars
          AAR="$(find brut.apktool/apktool-android/build/outputs/aar -maxdepth 1 -type f -name '*release*.aar' | head -n 1)"
          JAR_DIR="brut.apktool/apktool-android/build/libs-bundle"
          test -n "$AAR"
          test -d "$JAR_DIR"
          mkdir -p "$GITHUB_WORKSPACE/app/libs/apktool/runtime"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/apktool/apktool-android-1.0.0.aar"
          find "$JAR_DIR" -maxdepth 1 -type f -name '*.jar' -exec cp {} "$GITHUB_WORKSPACE/app/libs/apktool/runtime/" \;
          test "$(find "$GITHUB_WORKSPACE/app/libs/apktool/runtime" -name '*.jar' | wc -l)" -gt 0

      - name: Apply compilation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          marker = "    buildFeatures {"
          assert s.count(marker) == 1, "Unexpected Android Gradle configuration"
          s = s.replace(marker, "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n" + marker, 1)
          s += '\nconfigurations.configureEach {\n    exclude(group = "com.google.guava", module = "listenablefuture")\n}\n\nkotlin {\n    jvmToolchain(17)\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'
          p.write_text(s, encoding="utf-8")
          p = Path("app/src/main/java/com/example/apkrenamer/ApkRewriteEngine.kt")
          s = p.read_text(encoding="utf-8")
          old = "val updated = rootPackage.replaceFirst(xml) { m ->\n            m.groupValues[1] + newPackage + m.groupValues[2]\n        }"
          new = "val updated = xml.replaceRange(match.range, match.groupValues[1] + newPackage + match.groupValues[2])"
          assert s.count(old) == 1, "Unexpected Kotlin source version"
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Integrate read-only diagnostics and independent test app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              assert s.count(old) == 1, f"Unexpected source: {path}"
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          files = {'app/src/main/java/com/example/apkrenamer/diagnostics/ResourceDiagnostics.kt': 'package com.example.apkrenamer.diagnostics\n\nimport java.io.File\nimport javax.xml.XMLConstants\nimport javax.xml.parsers.SAXParserFactory\nimport org.xml.sax.SAXException\nimport org.xml.sax.SAXParseException\nimport org.xml.sax.helpers.DefaultHandler\n\n/** Read-only diagnostics. Never modifies resources, APKs or signatures. */\nobject ResourceDiagnostics {\n    enum class Stage { RESOURCE_LINK, RESOURCE_COMPILE, ENGINE_EXECUTION, SIGNING, UNKNOWN }\n    data class Finding(val path: String, val line: Int, val column: Int?, val message: String)\n    data class Report(val stage: Stage, val findings: List<Finding>)\n\n    private val location = Regex("^\\\\s*(.+?\\\\.xml):(\\\\d+)(?::(\\\\d+))?:\\\\s*error:\\\\s*(.+)$", RegexOption.IGNORE_CASE)\n\n    fun parseLog(log: String): Report {\n        val findings = log.lineSequence().mapNotNull { line ->\n            val m = location.matchEntire(line) ?: return@mapNotNull null\n            val number = m.groupValues[2].toIntOrNull() ?: return@mapNotNull null\n            val path = m.groupValues[1].replace(\'\\\\\', \'/\')\n            val resource = path.lastIndexOf("/res/")\n            val shown = when {\n                resource >= 0 -> path.substring(resource + 1)\n                path.startsWith("res/") -> path\n                else -> path.substringAfterLast(\'/\')\n            }\n            Finding(shown, number, m.groupValues[3].toIntOrNull(), m.groupValues[4])\n        }.distinct().toList()\n        val stage = when {\n            log.contains("failed linking file resources", true) || log.contains("failed linking references", true) -> Stage.RESOURCE_LINK\n            log.contains("failed to compile", true) || log.contains("resource compilation failed", true) -> Stage.RESOURCE_COMPILE\n            log.contains("cannot run program", true) || log.contains("permission denied", true) && log.contains("aapt2", true) -> Stage.ENGINE_EXECUTION\n            log.contains("APK 签名验证失败") || log.contains("APK signing failed", true) -> Stage.SIGNING\n            else -> Stage.UNKNOWN\n        }\n        return Report(stage, findings)\n    }\n\n    /** Human-readable summary; callers should retain the unmodified original log. */\n    fun summary(log: String): String {\n        val report = parseLog(log)\n        val title = when (report.stage) {\n            Stage.RESOURCE_LINK -> "失败阶段：资源链接"\n            Stage.RESOURCE_COMPILE -> "失败阶段：资源编译"\n            Stage.ENGINE_EXECUTION -> "失败阶段：引擎执行"\n            Stage.SIGNING -> "失败阶段：签名验证"\n            Stage.UNKNOWN -> "失败阶段：未分类，请查看原始日志"\n        }\n        return buildString {\n            append(title)\n            report.findings.take(10).forEach { finding ->\n                append("\\n").append(finding.path).append(":").append(finding.line)\n                finding.column?.let { append(":").append(it) }\n                append("\\n").append(finding.message)\n            }\n            if (report.findings.size > 10) append("\\n更多问题请查看原始日志。")\n        }\n    }\n\n    /** Syntax only, not Android resource semantics. Rejects DTDs and external entities. */\n    fun checkXml(file: File): Finding? {\n        val parser = SAXParserFactory.newInstance().apply {\n            isNamespaceAware = true\n            setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true)\n            setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)\n            setFeature("http://xml.org/sax/features/external-general-entities", false)\n            setFeature("http://xml.org/sax/features/external-parameter-entities", false)\n        }.newSAXParser()\n        val handler = object : DefaultHandler() {\n            override fun resolveEntity(publicId: String?, systemId: String?): org.xml.sax.InputSource {\n                throw SAXException("External entity rejected")\n            }\n            override fun error(e: SAXParseException) { throw e }\n            override fun fatalError(e: SAXParseException) { throw e }\n        }\n        return try {\n            file.inputStream().use { parser.parse(it, handler) }\n            null\n        } catch (e: SAXParseException) {\n            Finding(file.name, e.lineNumber, e.columnNumber, e.message.orEmpty())\n        } catch (e: SAXException) {\n            Finding(file.name, 0, null, e.message.orEmpty())\n        }\n    }\n}\n', 'app/src/test/java/com/example/apkrenamer/diagnostics/DiagnosticsTest.kt': 'package com.example.apkrenamer.diagnostics\n\nimport java.nio.file.Files\n\nfun main() {\n    var count = 0\n    fun test(name: String, check: () -> Boolean) {\n        check(check()) { "FAIL: $name" }\n        println("PASS: $name")\n        count++\n    }\n    val d = ResourceDiagnostics\n    test("resource link and location") {\n        val r = d.parseLog("/tmp/demo/res/layout/sample.xml:3:7: error: invalid test attribute\\nerror: failed linking file resources.")\n        r.stage == ResourceDiagnostics.Stage.RESOURCE_LINK && r.findings.single() == ResourceDiagnostics.Finding("res/layout/sample.xml",3,7,"invalid test attribute")\n    }\n    test("resource compilation") { d.parseLog("resource compilation failed").stage == ResourceDiagnostics.Stage.RESOURCE_COMPILE }\n    test("engine startup") { d.parseLog("Cannot run program aapt2: Permission denied").stage == ResourceDiagnostics.Stage.ENGINE_EXECUTION }\n    test("signature verification") { d.parseLog("APK 签名验证失败").stage == ResourceDiagnostics.Stage.SIGNING }\n    test("unknown remains unknown") { d.parseLog("Unexpected error").stage == ResourceDiagnostics.Stage.UNKNOWN }\n    test("valid XML") {\n        val f = Files.createTempFile("demo-valid", ".xml").toFile()\n        try { f.writeText("<sample><text>demo</text></sample>"); d.checkXml(f) == null } finally { f.delete() }\n    }\n    test("malformed XML") {\n        val f = Files.createTempFile("demo-invalid", ".xml").toFile()\n        try { f.writeText("<sample>\\n<text></sample>"); d.checkXml(f)?.line == 2 } finally { f.delete() }\n    }\n    test("DTD rejected without loading external entity") {\n        val f = Files.createTempFile("demo-dtd", ".xml").toFile()\n        try { f.writeText("<!DOCTYPE sample [<!ENTITY x SYSTEM \'file:///nonexistent\'>]><sample>&x;</sample>"); d.checkXml(f) != null } finally { f.delete() }\n    }\n    test("summary includes location and reason") {\n        val summary = d.summary("/tmp/demo/res/layout/sample.xml:3: error: invalid test attribute\\nerror: failed linking file resources.")\n        summary.contains("失败阶段：资源链接") && summary.contains("res/layout/sample.xml:3") && summary.contains("invalid test attribute")\n    }\n    test("unknown summary does not invent a cause") { d.summary("Unexpected error").contains("未分类") }\n    println("$count/10 tests passed")\n}\n', 'app/src/test/java/com/example/apkrenamer/diagnostics/DiagnosticsRegressionTest.kt': 'package com.example.apkrenamer.diagnostics\n\nimport org.junit.Test\n\nclass DiagnosticsRegressionTest {\n    @Test fun allRegressionCases() { main() }\n}\n', 'sample/build.gradle.kts': 'plugins { id("com.android.application") }\n\nandroid {\n    namespace = "com.example.renamerfixture"\n    compileSdk = 35\n    defaultConfig {\n        applicationId = "com.example.renamerfixture"\n        minSdk = 26\n        targetSdk = 35\n        versionCode = 1\n        versionName = "1.0"\n    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n', 'sample/src/main/AndroidManifest.xml': '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application android:label="Renamer 测试应用" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">\n        <activity android:name=".FixtureActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n', 'sample/src/main/java/com/example/renamerfixture/FixtureActivity.java': 'package com.example.renamerfixture;\n\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.widget.TextView;\n\npublic class FixtureActivity extends Activity {\n    @Override public void onCreate(Bundle state) {\n        super.onCreate(state);\n        setContentView(R.layout.fixture);\n        TextView label = findViewById(R.id.package_label);\n        label.setText("Test APK\\nPackage: " + getPackageName());\n    }\n}\n', 'sample/src/main/res/layout/fixture.xml': '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent" android:layout_height="match_parent"\n    android:orientation="vertical" android:padding="24dp">\n    <TextView android:id="@+id/package_label" android:layout_width="match_parent"\n        android:layout_height="wrap_content" android:textSize="20sp" android:gravity="center" />\n</LinearLayout>\n'}
          for path, content in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              assert not p.exists(), f"Unexpected existing file: {path}"
              p.write_text(content, encoding="utf-8")

          replace_one('app/build.gradle.kts', 'versionCode = 2', 'versionCode = 7')
          replace_one('app/build.gradle.kts', 'versionName = "0.2.0"', 'versionName = "0.7.0"')
          replace_one('app/build.gradle.kts', 'dependencies {', 'dependencies {\n    testImplementation("junit:junit:4.13.2")')
          replace_one('settings.gradle.kts', 'include(":app")', 'include(":app", ":sample")')
          replace_one('app/src/main/java/com/example/apkrenamer/MainActivity.kt', 'import androidx.compose.material3.Text\n', 'import androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\nimport com.example.apkrenamer.diagnostics.ResourceDiagnostics\n')
          replace_one('app/src/main/java/com/example/apkrenamer/MainActivity.kt', 'V0.3 · 卓易通适配验证版 · 本地离线处理', 'V0.7 · 资源诊断验证版 · 本地离线处理')
          replace_one('app/src/main/java/com/example/apkrenamer/MainActivity.kt', '                error?.let {\n                    Text(it, color = MaterialTheme.colorScheme.error)\n                }', '                error?.let { log ->\n                    var expanded by remember(log) { mutableStateOf(false) }\n                    Text(ResourceDiagnostics.summary(log), color = MaterialTheme.colorScheme.error)\n                    TextButton(onClick = { expanded = !expanded }) {\n                        Text(if (expanded) "收起原始日志" else "查看完整原始日志")\n                    }\n                    if (expanded) Text(log, style = MaterialTheme.typography.bodySmall)\n                    TextButton(onClick = {\n                        val clipboard = context.getSystemService(android.content.ClipboardManager::class.java)\n                        clipboard?.setPrimaryClip(android.content.ClipData.newPlainText("APK Renamer diagnostics", log))\n                    }) { Text("复制原始日志") }\n                }')
          PY

      - name: Improve read-only error classification and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/apkrenamer/diagnostics/ResourceDiagnostics.kt")
          s = p.read_text(encoding="utf-8")
          old = "            log.contains(\"failed linking file resources\", true) || log.contains(\"failed linking references\", true) -> Stage.RESOURCE_LINK"
          new = "            log.contains(\"failed linking file resources\", true) || log.contains(\"failed linking references\", true) -> Stage.RESOURCE_LINK\n            log.contains(\"aapt2\", true) && !log.contains(\"cannot run program\", true) && !log.contains(\"permission denied\", true) &&\n                (Regex(\"\"\"(?:,\\s*link\\s*,|\\baapt2(?:\\.so)?\\s+link\\b)\"\"\", RegexOption.IGNORE_CASE).containsMatchIn(log)) &&\n                findings.isNotEmpty() -> Stage.RESOURCE_LINK"
          assert s.count(old) == 1, "Unexpected diagnostics source"
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          t = Path("app/src/test/java/com/example/apkrenamer/diagnostics/IncompleteResourceLogTest.kt")
          assert not t.exists(), "Unexpected existing test file"
          t.write_text("package com.example.apkrenamer.diagnostics\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass IncompleteResourceLogTest {\n    @Test fun linkingErrorWithoutFinalSummary() {\n        val log = \"Execution failed: [/tmp/libaapt2.so, link, -o, sample.apk]\\nstderr:\\n/tmp/demo/res/layout/sample.xml:3: error: invalid sample attribute\"\n        val report = ResourceDiagnostics.parseLog(log)\n        assertEquals(ResourceDiagnostics.Stage.RESOURCE_LINK, report.stage)\n        assertEquals(\"res/layout/sample.xml\", report.findings.single().path)\n        assertEquals(3, report.findings.single().line)\n    }\n\n    @Test fun commandLineWithMissingResourceSummary() {\n        val log = \"aapt2 link -o sample.apk\\nres/layout/sample.xml:9: error: invalid sample value\"\n        assertEquals(ResourceDiagnostics.Stage.RESOURCE_LINK, ResourceDiagnostics.parseLog(log).stage)\n    }\n\n    @Test fun unrelatedLinkTextRemainsUnknown() {\n        val log = \"Application link validation\\nres/layout/sample.xml:2: error: sample\"\n        assertEquals(ResourceDiagnostics.Stage.UNKNOWN, ResourceDiagnostics.parseLog(log).stage)\n    }\n\n    @Test fun executionFailureIsNotAResourceLinkFailure() {\n        val log = \"Cannot run program aapt2 link: Permission denied\\nres/layout/sample.xml:2: error: sample\"\n        assertEquals(ResourceDiagnostics.Stage.ENGINE_EXECUTION, ResourceDiagnostics.parseLog(log).stage)\n    }\n}\n", encoding="utf-8")
          PY

      - name: Run diagnostics unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :sample:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Renamer-V0.7-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload independent test APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Renamer-TestSample
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
